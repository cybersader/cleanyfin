# CI gate for the Jellyfin plugin (plugin/).
# Restores + builds the C# plugin against Jellyfin.Controller on every change.
name: plugin-ci

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'delivery/Cleanyfin.Delivery/**'
      - 'delivery/evidence/**'
      - '.github/workflows/plugin-ci.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - 'delivery/Cleanyfin.Delivery/**'
      - 'delivery/evidence/**'
      - '.github/workflows/plugin-ci.yml'

concurrency:
  group: plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One row per JellyfinTarget in plugin/Jellyfin.Plugin.Cleanyfin.csproj.
        include:
          - jellyfin: '10.11'
            dotnet: '9.0.x'
          - jellyfin: '12.4'
            dotnet: '10.0.x'
    defaults:
      run:
        working-directory: plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore
        run: dotnet restore -p:JellyfinTarget=${{ matrix.jellyfin }}

      - name: Build
        run: dotnet build -c Release --no-restore -p:JellyfinTarget=${{ matrix.jellyfin }}
